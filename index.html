}

  linear-gradient(90deg, transparent 0 6%, rgba(98,170,88,.95) 6% 6.7%, transparent 6.7% 12%, rgba(98,170,88,.95) 12% 12.7%, transparent 12.7% 20%, rgba(98,170,88,.95) 20% 20.7%, transparent 20.7% 28%, rgba(98,170,88,.95) 28% 28.7%, transparent 28.7% 36%, rgba(98,170,88,.95) 36% 36.7%, transparent 36.7% 44%, rgba(98,170,88,.95) 44% 44.7%, transparent 44.7% 52%, rgba(98,170,88,.95) 52% 52.7%, transparent 52.7% 60%, rgba(98,170,88,.95) 60% 60.7%, transparent 60.7% 68%, rgba(98,170,88,.95) 68% 68.7%, transparent 68.7% 76%, rgba(98,170,88,.95) 76% 76.7%, transparent 76.7% 84%, rgba(98,170,88,.95) 84% 84.7%, transparent 84.7% 92%, rgba(98,170,88,.95) 92% 92.7%, transparent 92.7%);
  opacity: .55; }

/* v13 밝은 고가독성 테마: 그림은 배너, 글자는 흰 카드 위 */
:root {

  --panel: #fffaf0 !important;
  --panel-2: #fff3d8 !important;
  --text: #23304a !important;
  --muted: #5f6b7f !important;
  --line: rgba(113, 88, 36, .22) !important;
  --accent: #d6a63b !important;
  --accent-2: #7b5410 !important;

  color-scheme: light !important;

  background: linear-gradient(180deg, #ecf8ff 0%, #fff7e8 42%, #fff3d9 100%) !important;

  inset: 0 !important;

/* v36-4: 그리스 신전 배경권 적용 시 화면 위를 천천히 날아다니는 나비 */
.temple-butterflies {
  position: fixed !important;
  inset: 0 !important;
  z-index: 1200 !important;
  pointer-events: none !important;
  overflow: hidden !important;
}
.temple-butterfly {
  position: absolute !important;
  left: -12vw !important;
  top: var(--start-y, 50%) !important;
  font-size: var(--size, 28px) !important;
  line-height: 1 !important;
  opacity: .96 !important;
  filter: drop-shadow(0 5px 7px rgba(65, 44, 15, .16)) !important;
  will-change: transform !important;
  animation:
    templeButterflyFly var(--duration, 18s) linear var(--delay, 0s) infinite,
    templeButterflyBob var(--bob-duration, 3.8s) ease-in-out calc(var(--delay, 0s) * .35) infinite alternate !important;
}
.temple-butterfly.b1 { --start-y: 18%; --size: 32px; --duration: 17s; --delay: -2s; --bob-duration: 3.1s; }
.temple-butterfly.b2 { --start-y: 34%; --size: 40px; --duration: 23s; --delay: -11s; --bob-duration: 4.2s; }
.temple-butterfly.b3 { --start-y: 58%; --size: 30px; --duration: 20s; --delay: -7s; --bob-duration: 3.6s; }
.temple-butterfly.b4 { --start-y: 72%; --size: 37px; --duration: 25s; --delay: -16s; --bob-duration: 4.8s; }
.temple-butterfly.b5 { --start-y: 44%; --size: 34px; --duration: 19s; --delay: -13s; --bob-duration: 3.3s; }
.temple-butterfly.b6 { --start-y: 82%; --size: 28px; --duration: 27s; --delay: -21s; --bob-duration: 5.1s; }

@keyframes templeButterflyFly {
  0% {
    transform: translateX(-12vw) rotate(-7deg) scaleX(1);
  }
  28% {
    transform: translateX(30vw) rotate(8deg) scaleX(.94);
  }
  58% {
    transform: translateX(62vw) rotate(-5deg) scaleX(1);
  }
  100% {
    transform: translateX(118vw) rotate(7deg) scaleX(.96);
  }
}
@keyframes templeButterflyBob {
  0% { margin-top: -16px; }
  100% { margin-top: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .temple-butterfly {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    opacity: .42 !important;
  }
}

      <div class="tip-jump-row">
        <button class="secondary" id="jumpEvelynTipBtn">에블린 선생님 tip</button>
        <button class="secondary" id="jumpHeonTipBtn">헌 선생님 tip</button>
      </div>

      <div class="teacher-tip-block" id="evelynTipBlock">
        <p class="eyebrow">에블린 선생님의 tip</p>
        <h2>사랑의 신 아모르(에로스)</h2>
        <p class="muted handwritten byline">by. Evelyn</p>
        <div class="tip-note teacher-box notebook-paper handwritten">
          <p>안녕하세요? 이 책은 사랑의 신 아모르를 소개하는 책입니다.</p>
          <p><span class="highlight">아모르는 사랑의 여신 비너스와 전쟁의 신 마르스의 아들이에요.</span> 에로스에게는 작은 날개가 달려 있어요.</p>
          <h3>아모르의 상징물</h3>
          <p>아모르의 상징물은 활과 화살이에요. 하지만 아모르는 두 가지 화살이 있어요. 황금 화살에 맞으면 사랑에 빠지고, 납 화살에 맞으면 사랑을 거부하거나 멀어지게 돼요.</p>
          <p>또 아모르의 상징물은 햇불이에요. 사랑의 열정과 타오르는 감정을 상징해요. 또 다른 상징물은 장미예요. 아름다움, 사랑, 로맨스를 상징하는 꽃으로 아모르와 함께 자주 등장해요.</p>
          <p>아모르의 상징물은 이것만 있지 않아요. 바로 비둘기예요. 순수한 사랑과 평화를 상징하며 아모르와 함께 그려져요.</p>
          <h3>아모르의 어머니, 비너스</h3>
          <p>비너스도 아모르처럼 사랑의 신이에요. 비너스는 맨몸으로 서서 두 손으로 머리카락을 잡고 있어요.</p>
          <p><span class="highlight">신화에 따르면 비너스는 바다의 거품에서 맨몸으로 태어났고 태어날 때부터 성인의 모습이에요.</span></p>
          <p><span class="highlight">비너스의 자세는 오른손은 가슴에 올려놓고 왼손은 흘러내리는 치마를 잡는 거예요!</span></p>
        </div>
      </div>

      <div class="teacher-tip-block heon-tip-block" id="heonTipBlock">
        <p class="eyebrow">헌 선생님의 tip</p>
        <h2>신들의 탄생과 전쟁 이야기</h2>
        <p class="muted handwritten byline">by. Heon</p>
        <div class="tip-note teacher-box notebook-paper handwritten">
          <h3>1. 디오노시스와 사일레노스</h3>
          <p><span class="highlight">디오노시스</span>라는 신은 <span class="highlight">포도주</span>와 술과 <span class="highlight">포도</span>의 신이야.</p>
          <p>포도야? 포도주야? 둘 다야. 포도에서 포도주가 나오고, 포도주와 술이 디오노시스와 연결되기 때문이야.</p>
          <p>그리고 그 디오노시스의 스승을 <span class="highlight">사일레노스</span>라고 해. 또 그의 추종자들을 <span class="highlight">사일렌스</span>라고 하기도 해. 여기서는 헷갈리면 안 돼.</p>
          <p>사일레노스는 디오노시스의 스승이고, 사일렌스는 그를 따르는 무리처럼 볼 수 있어.</p>

          <h3>2. 헥헤이트라는 특별한 여신</h3>
          <p>이제, <span class="highlight">헥헤이트</span>란 여신에 대해서 설명해 볼게.</p>
          <p>이 여신은 아주 특별하고, 사람들 사이에서 헥헤이트의 뜻과 의미에 대한 논쟁이 많이 벌어지고 있는 여신이지. 내가 차근차근 풀이해 줄게.</p>
          <p>헥헤이트는 <span class="highlight">저세상에서 온 요정 같은 존재</span>야. 하지만 사람들이 그걸 신으로 알고 있지. 우선, 물론 요정과 신 둘 다 맞아.</p>
          <p>헥헤이트는 그래서 <span class="highlight">어둠의 마법</span>과 어두운 곳을 자기 본거지로 삼아. 그리고 그 헥헤이트의 상징 물건은 <span class="highlight">횃불</span>이야.</p>
          <p>이때 당시에는 횃불이 불을 밝히는 것뿐만 아니라, <span class="highlight">정치적이고 종교적인 의미</span>도 많았어. 거기에 불을 붙이고, 신성한 기름을 넣어서 불을 밝힌 다음, 신들에게 기도하거나 제사를 지낼 때도 많이 사용됐어.</p>

          <h3>3. 제우스와 티탄들의 전쟁</h3>
          <p>이번에는 <span class="highlight">제우스와 티탄들의 전쟁</span> 이야기를 해 볼게.</p>
          <p>최고급 무기를 가진 제우스의 군대도 문제가 있었다.</p>
          <p>자기들이 있던 데는 너무 지대가 낮은 곳이었다. 그래서 밤에 <span class="highlight">마운트 올림포스</span>라는 산에 올라갔다.</p>
          <p>낮이 되자 <span class="highlight">제우스는 번개</span>로, <span class="highlight">포세이돈은 바람과 물</span>로, <span class="highlight">하데스는 유령과 악령</span>으로 공격을 퍼부었다.</p>
          <p>그래서 <span class="highlight">오르티스 군대</span>는 무너졌다. 그렇게 해서 제우스는 아버지를 산산조각 내고, 아버지를 다시 한 번 바다에 던져 버렸다.</p>
          <p><span class="highlight">우라노스와 같은 최후</span>를 맞이하게 되었던 거다. 그리고 우라노스가 얘기했던 저주도 실제가 되었다.</p>

          <h3>4. 올림포스의 열두 신, 아테나부터</h3>
          <p>아, 그리고 <span class="highlight">올림포스의 열두 신</span> 이야기를 해 보자.</p>
          <p>열두 신은 일단 <span class="highlight">아테나</span>부터 시작하자.</p>
          <p>생각하는 힘과 기억력이 좋은 타이탄 <span class="highlight">미티스</span>가 있었다. 제우스가 미티스와 결혼해서 낳은 아이가 아테나였다.</p>
          <p>하지만 미티스가 낳은 아들은 제우스보다, 아버지보다 강한 아이가 될 것이라는 <span class="highlight">신탁</span>이 있었다.</p>
          <p>그래서 제우스는 미티스를 입으로 빨아들여 버렸다. <span class="highlight">마치 크로노스처럼</span> 말이다. 그리고 다른 신들에게 미안하다고 했다.</p>
          <p>하지만 아테나와 미티스는 아직도 제우스의 몸속에 있었다.</p>

          <h3>5. 제우스의 머리에서 나온 아테나</h3>
          <p>그런데 <span class="highlight">아테나</span>는 제우스의 목뼈를 잡고 두개골 안으로 쏙 들어갔다.</p>
          <p>그다음에 제우스의 두개골에 막 주먹을 날리기 시작했다.</p>
          <p>제우스가 아침 식사를 하고 있을 때, 아테나는 아주 세게 두드리면서 말했다.</p>
          <p><span class="highlight">“나가고 싶어! 나가고 싶어!”</span></p>
          <p>아테나는 세게 두드렸고, 결국 <span class="highlight">제우스의 머리</span>는 식사하는 도중에 갈라져 버렸다.</p>
          <p>그렇게 제우스의 두개골 안에서 아테나가 나오게 되었다. 하지만 <span class="highlight">미티스는 제우스의 뱃속에서 죽었다.</span></p>

          <h3>6. 아르테미스와 아폴로의 탄생</h3>
          <p>이제 <span class="highlight">아르테미스</span> 이야기를 해 보자.</p>
          <p>아르테미스는 제우스의 행태 때문에 태어난 신이라고 볼 수 있다.</p>
          <p><span class="highlight">헤라의 노여움</span>을 산 여자가 있었다. 그 여자는 제우스의 부인이 될 여자였다. 인간 부인이었다.</p>
          <p>헤라는 올림포스에 있는 부인이었지만, 제우스는 그리스의 여자들을 쫓아다녔다. 그중 헤라가 눈치챈 사람들 중 한 사람이 있었다.</p>
          <p>헤라는 그 여자에게 <span class="highlight">저주</span>를 내렸다.</p>
          <p>어떤 땅, 어떤 뿌리가 있는 땅이든 이 여자를 받아주지 말라. 섬도 안 된다. 하늘도 안 된다. 이런 저주를 내린 것이다.</p>
          <p>그러자 아이를 낳아야 했던 <span class="highlight">레미스</span>는 뿌리가 없는 섬에 도착하여, 거기에서 안식을 취했다.</p>
          <p>거기에서 아이 둘이 태어났는데, 그게 바로 <span class="highlight">아르테미스와 아폴로</span>다.</p>
          <p>둘 다 아주 중요한 신이었다.</p>

          <h3>8. 디오니소스의 이상한 탄생</h3>
          <p>이제 마지막으로 <span class="highlight">디오니소스의 탄생</span>을 봅시다.</p>
          <p>디오니소스는 아주 이상하게 태어난 아이입니다. 또 제우스의 인간 여자친구 사이에서 태어난 아이입니다.</p>
          <p>하지만 그 인간 여자친구는 너무 자만해서, 자기가 헤라처럼 제우스의 신 형태를 볼 수 있다고 말했다.</p>
          <p>그런데 <span class="highlight">신의 형태</span>는 인간이 보면 바로 타버릴 수 있기 때문에 아주 조심해야 한다.</p>
          <p>하지만 그걸 모른 제우스의 여자친구는 결국 <span class="highlight">타죽어 버렸다</span>.</p>
          <p>하지만 그 안에 있던 아이는 제우스의 자식이니까, 제우스의 피가 들어 있어서 어떻게든 살아남았다.</p>
          <p>제우스는 그 아이를 가엾게 여겨, <span class="highlight">자기 허벅지</span>를 잘라서 아이를 그 안에 쑤셔 넣었다.</p>
          <p>그리고 <span class="highlight">8년 뒤</span>에 그 아이를 꺼내 보니 이미 <span class="highlight">성체</span>가 되어 있었다.</p>
          <p>그게 바로 디오니소스다.</p>
        </div>
      </div>

        <h2>선사관에서 발견한 무기들</h2>
        <p class="muted handwritten byline">by. Luke</p>
        <div class="tip-note teacher-box notebook-paper handwritten">

          <p>손잡이에 <span class="highlight">날개 모양의 무늬</span>가 발견되었고, 지금 무기들처럼 날카롭지는 못해.</p>
          <p>왜냐하면 거푸집을 이용해서 철과 청동으로 만든 무기라서 그런 것 같아.</p>

          <p>그리고 <span class="highlight">손잡이와 칼날이 분리형</span>으로 되어 있는 게 흥미로웠어!</p>

function getCurrentChapterNo() {
  return selectedChapterNo || 1;
}

function getChapterItems() {
  const chapterNo = getCurrentChapterNo();
  return DATA.items.filter(item => (item.chapter || 1) === chapterNo);
}

function getChapterCategories() {
  return ['전체', ...Array.from(new Set(getChapterItems().flatMap(i => i.categories)))];
}

const categories = getChapterCategories();

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function sample(arr, n) {
  return shuffle(arr).slice(0, n);
}

function strip(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }

function makeOptions(correct, pool, key) {
  const distractors = sample(pool.filter(item => strip(item[key]) !== strip(correct)), 3).map(item => item[key]);
  return shuffle([correct, ...distractors]);
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function asConnectionOption(text) {
  return `역사 연결 단서: ${text}`;
}

function makeOptionsFromValues(correct, values, formatter) {
  const formattedCorrect = formatter(correct);
  const distractors = sample(values.filter(value => strip(value) !== strip(correct)), 3).map(formatter);
  return shuffle([formattedCorrect, ...distractors]);
}

  { no: 36, label: '로마 정치', q: '카이사르는 로마 역사에서 어떤 변화를 떠올리게 하나요?', a: '공화정에서 제정으로 넘어가는 권력 변화', o: ['그리스 도기 공방의 작업 순서', '출산 여신에게 바치는 기도', '목신 판의 악기 연주법'], e: '카이사르는 장군이자 정치가로, 로마 권력 구조의 변화를 이해할 때 중요한 인물입니다.' },
  { no: 37, label: '제사 역할', q: '사제는 어떤 일을 하는 사람인가요?', a: '신에게 제사를 주관하는 사람', o: ['도기를 굽는 장인', '전차를 수리하는 기술자', '토가를 파는 상인'], e: '고대 사회에서 종교는 정치, 가정, 전쟁과도 연결되었습니다.' },
  { no: 38, label: '그리스 연회', q: '심포시온에서는 어떤 일이 함께 이루어졌나요?', a: '술, 대화, 음악, 놀이가 함께 이루어졌다.', o: ['혼자 조용히 잠만 잤다.', '전쟁 포로만 재판했다.', '금속 무기만 만들었다.'], e: '심포시온은 크라테르, 코타보스, 음악, 신화가 연결되는 그리스 남성 귀족의 연회 문화입니다.' },
  { no: 39, label: '신라 연결', q: '신라 황남대총의 봉수형 유리병이 중요한 이유는 무엇인가요?', a: '로마·서역 유리문화가 신라까지 전해졌을 가능성을 보여 주기 때문이다.', o: ['신라 사람들이 모두 로마어만 썼다는 증거이기 때문이다.', '그리스 조각상이 신라에서 만들어졌다는 증거이기 때문이다.', '트로이전쟁이 신라에서 일어났다는 증거이기 때문이다.'], e: '이 유리병은 물건과 기술, 취향이 먼 지역까지 이동했음을 보여 주는 중요한 자료입니다.' },
  { no: 40, label: '생활 도구', q: '등잔은 무엇을 위해 쓰던 물건인가요?', a: '기름을 넣어 불을 밝히기 위해', o: ['포도주를 섞기 위해', '시민권을 증명하기 위해', '신화를 새기기 위해'], e: '등잔은 집, 제단, 무덤 등 여러 공간에서 사용된 생활 도구입니다.' },
  { no: 41, label: '장례미술', q: '장례미술에서 망자는 누구를 뜻하나요?', a: '죽은 사람', o: ['전령 신', '포도주 그릇', '로마 시민 옷'], e: '망자를 어떻게 기억했는지 보면 고대인의 죽음에 대한 생각을 알 수 있습니다.' },
  { no: 42, label: '몸짓 읽기', q: '장례부조에서 손을 잡는 장면은 무엇을 나타낼 수 있나요?', a: '가족, 혼인, 작별의 결속', o: ['전차 경주의 출발 신호', '도기 가격 흥정', '악기 연주 방법'], e: '손잡기 장면은 사람 사이의 관계와 이별의 감정을 보여 줍니다.' },
  { no: 43, label: '이별 장면', q: '작별 장면이 장례부조에 나오는 이유는 무엇인가요?', a: '산 자와 죽은 자가 헤어지는 순간을 보여 주기 위해', o: ['포도주를 더 맛있게 섞기 위해', '철학자의 책 제목을 적기 위해', '동물의 종류를 분류하기 위해'], e: '장례부조는 죽은 사람과 남은 사람의 관계를 시각적으로 표현했습니다.' },
  { no: 44, label: '이름 비교', q: '제우스, 유피테르, 주피터는 무엇을 보여 주는 예인가요?', a: '같은 최고신이 문화와 언어에 따라 다른 이름으로 불린 예', o: ['서로 전혀 관계없는 세 명의 로마 황제', '신라의 세 가지 유리병 이름', '도기 공방의 세 가지 도구'], e: '이름은 달라도 하늘, 번개, 권위라는 핵심 성격은 이어집니다.' }

,
  { no: 46, label: '시대 구분', q: '문자로 쓴 기록이 아직 남아 있지 않은 시대를 무엇이라고 하나요?', a: '선사 시대', o: ['삼국 시대', '조선 시대', '대한 제국 시기'], e: '선사 시대는 문자 기록이 남기 전의 시대라서 유물과 유적을 통해 생활 모습을 추리합니다.' },
  { no: 47, label: '자료 해석', q: '역사 시대가 선사 시대와 구분되는 가장 중요한 기준은 무엇인가요?', a: '문자로 남긴 기록이 있는가', o: ['사람들이 돌을 사용했는가', '농사를 지었는가', '마을에 집이 있었는가'], e: '역사는 문자 기록을 바탕으로 과거를 살피는 단계이고, 선사는 주로 유물과 유적을 통해 추리합니다.' },
  { no: 48, label: '구석기 도구', q: '주먹도끼를 보면 구석기 사람들이 주로 어떤 방식으로 돌도구를 만들었음을 알 수 있나요?', a: '돌을 깨뜨려 날카로운 부분을 만들었다.', o: ['쇠를 녹여 틀에 부었다.', '흙을 구워 무늬를 새겼다.', '청동 표면을 거울처럼 갈았다.'], e: '주먹도끼는 돌을 떼어 내며 만든 뗀석기의 대표 사례입니다.' },
  { no: 49, label: '도구와 생활', q: '슴베찌르개의 아래쪽에 슴베가 있는 까닭으로 가장 알맞은 것은 무엇인가요?', a: '나무나 뼈 손잡이에 끼워 쓰기 위해서', o: ['곡식을 저장하기 위해서', '제사 때 소리를 내기 위해서', '물을 담아 끓이기 위해서'], e: '슴베는 손잡이에 끼우는 부분입니다. 도구를 더 단단하게 잡고 찌르는 데 유리합니다.' },
  { no: 50, label: '유적 읽기', q: '울산 반구대 암각화가 선사 사람들의 생활을 알려 주는 까닭은 무엇인가요?', a: '고래와 동물, 사냥 장면이 바위에 새겨져 있기 때문이다.', o: ['왕의 법률이 한자로 적혀 있기 때문이다.', '청동 거울이 대량으로 묻혀 있기 때문이다.', '논의 모양이 정확히 그려져 있기 때문이다.'], e: '암각화는 문자 기록은 아니지만 당시 사람들이 무엇을 보고 사냥했는지 보여 주는 그림 자료입니다.' },
  { no: 51, label: '신석기 생활', q: '갈돌과 갈판이 많이 쓰였다는 사실은 어떤 생활 변화와 가장 관련 깊나요?', a: '곡식이나 열매를 갈아 먹는 생활', o: ['말을 타고 넓은 지역을 정복하는 생활', '청동검으로 권위를 드러내는 생활', '비단길을 통해 유리를 수입하는 생활'], e: '갈돌과 갈판은 곡식·열매 등을 갈아 음식으로 만드는 도구입니다.' },
  { no: 52, label: '구석기 생활', q: '구석기 시대 사람들의 생활 모습으로 가장 알맞은 것은 무엇인가요?', a: '사냥과 채집을 하며 이동 생활을 했다.', o: ['논농사를 중심으로 큰 나라를 세웠다.', '철을 생산해 주변 지역과 교역했다.', '문자로 법전을 기록했다.'], e: '구석기 시대에는 농경과 정착이 본격화되기 전이어서 이동 생활의 비중이 컸습니다.' },
  { no: 53, label: '신석기 생활', q: '신석기 시대에 새롭게 두드러진 변화로 알맞은 것은 무엇인가요?', a: '농사와 정착 생활이 시작되었다.', o: ['비파형동검이 지배자의 상징이 되었다.', '철 생산이 활발해졌다.', '율령으로 나라를 다스렸다.'], e: '신석기 시대에는 간석기와 토기를 사용하고, 농사와 정착 생활이 나타납니다.' },
  { no: 54, label: '청동기 사회', q: '청동기 시대에 비파형동검과 청동거울 같은 물건이 중요했던 까닭은 무엇인가요?', a: '쉽게 만들 수 없는 귀한 물건이라 권력자의 힘을 보여 주었기 때문이다.', o: ['모든 사람이 같은 양으로 나누어 가진 생활용품이었기 때문이다.', '주로 어린이 장난감으로 쓰였기 때문이다.', '음식을 오래 보관하는 그릇이었기 때문이다.'], e: '청동기는 귀한 재료와 기술이 필요했기 때문에 지배자의 권위와 연결됩니다.' },
  { no: 55, label: '석기 구분', q: '뗀석기와 가장 가까운 설명은 무엇인가요?', a: '돌을 깨뜨려 날카로운 날을 만든 도구', o: ['돌을 곱게 갈아 매끈하게 만든 도구', '흙을 빚어 구운 그릇', '청동을 부어 만든 거울'], e: '뗀석기는 돌을 떼어 내며 만든 도구이고, 주먹도끼가 대표적입니다.' },
  { no: 56, label: '석기 구분', q: '간석기가 뗀석기와 다른 점은 무엇인가요?', a: '돌의 표면을 갈아서 더 매끄럽게 만들었다.', o: ['청동으로 만들어 더 반짝였다.', '흙을 구워 무늬를 찍었다.', '문자를 새겨 법으로 사용했다.'], e: '간석기는 돌을 갈아 만든 도구로 신석기 시대의 대표 도구입니다.' },
  { no: 57, label: '초기 국가', q: '부여의 정치 구조를 설명할 때 자주 나오는 말은 무엇인가요?', a: '사출도', o: ['골품제', '화백 회의', '비변사'], e: '부여에는 왕 아래 여러 가들이 각각 지역을 다스리는 사출도 구조가 있었습니다.' },
  { no: 58, label: '초기 국가', q: '고구려가 성장하기에 유리했던 조건으로 알맞은 것은 무엇인가요?', a: '산지가 많아 방어와 군사 활동에 유리했다.', o: ['넓은 평야에서 벼농사만 지었다.', '바다 한가운데 섬나라였다.', '사막 무역으로만 성장했다.'], e: '고구려는 산지가 많은 지역에서 성장했고 군사 활동을 통해 세력을 넓혔습니다.' },
  { no: 59, label: '여러 나라', q: '옥저를 설명한 내용으로 가장 알맞은 것은 무엇인가요?', a: '동해안 지역에 있던 나라로 고구려의 압력을 받았다.', o: ['한강 이남에서 백제로 바로 성장했다.', '왕 아래 사출도를 두었다.', '철을 많이 수출한 삼한의 나라였다.'], e: '옥저는 동해안 지역의 나라로, 강한 고구려의 영향을 받았습니다.' },
  { no: 60, label: '제천 행사', q: '동예의 대표적인 제천 행사로 알맞은 것은 무엇인가요?', a: '무천', o: ['영고', '동맹', '팔관회'], e: '동예의 무천, 부여의 영고, 고구려의 동맹처럼 나라별 제천 행사를 구분해야 합니다.' },
  { no: 61, label: '삼한', q: '마한에 대한 설명으로 알맞은 것은 무엇인가요?', a: '삼한 중 한반도 서남부에 있던 여러 소국의 연맹이다.', o: ['동해안의 작은 나라이다.', '압록강 주변의 산성 국가이다.', '청동기 시대의 대표 토기이다.'], e: '마한은 삼한 가운데 서남부 지역과 관련 깊고, 훗날 백제 성장의 바탕이 됩니다.' },
  { no: 62, label: '삼한', q: '변한의 특징을 가장 잘 보여 주는 키워드는 무엇인가요?', a: '철 생산', o: ['사출도', '무천', '빗살무늬토기'], e: '변한은 철 생산과 교역이 활발했던 지역으로 설명됩니다.' },
  { no: 63, label: '삼한', q: '진한은 훗날 어느 나라가 성장하는 바탕과 연결되나요?', a: '신라', o: ['고조선', '부여', '옥저'], e: '진한 지역의 여러 세력은 훗날 신라 성장과 연결해서 이해합니다.' },
  { no: 64, label: '신석기 유물', q: '신석기 여인상 같은 유물은 주로 어떤 내용을 생각하게 하나요?', a: '풍요와 생명에 대한 바람', o: ['철제 무기 생산 기술', '왕의 법률 조항', '로마식 조각 자세'], e: '여인상은 풍요, 생명, 출산에 대한 바람과 관련지어 해석됩니다.' },
  { no: 65, label: '신석기 토기', q: '빗살무늬토기의 실제 사용 모습으로 가장 자연스러운 것은 무엇인가요?', a: '밑부분을 모래나 흙에 박아 세워 두고 사용했다.', o: ['손잡이를 잡고 전쟁터에서 휘둘렀다.', '얼굴을 비춰 보는 거울로 사용했다.', '왕의 명령을 문자로 적어 붙였다.'], e: '빗살무늬토기는 밑이 뾰족한 형태가 많아 모래나 흙에 박아 세워 사용한 것으로 봅니다.' },

function makeHistoryQuestion(def) {
  const item = DATA.items.find(x => x.no === def.no) || DATA.items[0];
  return {
    id: `${def.no}-history-${strip(def.q).slice(0, 18)}`,
    itemNo: def.no,
    typeLabel: def.label || '역사 퀴즈',
    question: def.q,
    answer: def.a,
    options: shuffle([def.a, ...def.o]),
    explanation: def.e,
    item
  };
}

function buildQuestion(item, type, pool) {
  const def = HISTORY_QUIZ_BANK.find(q => q.no === item.no);
  if (def) return makeHistoryQuestion(def);

  const templates = [
    { label: '개념 확인', key: item.meaning ? 'meaning' : 'visual', question: `‘${item.keyword}’를 가장 바르게 설명한 것은 무엇인가요?` },
    { label: '자료 해석', key: 'visual', question: `사진자료에서 ‘${item.keyword}’를 확인할 때 먼저 봐야 할 대상은 무엇인가요?` },
    { label: '역사적 의미', key: 'importance', question: `‘${item.keyword}’가 역사 공부에서 중요한 까닭은 무엇인가요?` },
    { label: '쉽게 이해하기', key: item.easy ? 'easy' : 'meaning', question: `‘${item.keyword}’를 쉽게 이해한 설명으로 알맞은 것은 무엇인가요?` }
  ].filter(t => item[t.key]);

  const chosen = templates[item.no % templates.length] || templates[0];
  const answerKey = chosen.key;
  const answerValue = item[answerKey];
  const optionPool = pool.filter(candidate => candidate[answerKey]);

  return {
    id: `${item.no}-${answerKey}-generated`,
    itemNo: item.no,
    typeLabel: chosen.label,
    question: chosen.question,
    answer: answerValue,
    options: makeOptions(answerValue, optionPool, answerKey),
    explanation: item.easy || item.importance || item.meaning,
    item
  };
}


function getPool(category) {
  const chapterItems = getChapterItems();
  if (category === '전체') return chapterItems;
  return chapterItems.filter(item => item.categories.includes(category));
}

function buildQuiz(category, count, wrongOnly=false) {
  if (wrongOnly) {
    const chapterWrongs = getCurrentChapterWrongQuestions();
    if (chapterWrongs.length) return sample(chapterWrongs, Math.min(count, chapterWrongs.length));
    return [];
  }
  const pool = getPool(category).filter(item => !String(item.keyword).includes('에우…'));
  const generated = HISTORY_QUIZ_BANK
    .filter(def => pool.some(item => item.no === def.no))
    .map(makeHistoryQuestion);
  pool.forEach(item => {
    if (!generated.some(q => q.itemNo === item.no)) generated.push(buildQuestion(item, 'basic', pool));
  });
  return sample(generated, Math.min(count, generated.length));
}

  btn.className = `toc-item chapter-${chapter.no}${selectedChapterNo === chapter.no ? ' active' : ''}${chapter.active ? '' : ' locked'}`;
  btn.type = 'button';
  btn.innerHTML = `<span class="toc-item-visual" aria-hidden="true"></span><span class="toc-item-copy"><strong>${chapter.no}. ${chapter.title}</strong><span>${chapter.status}</span></span>`;
  btn.addEventListener('click', () => {
    if (chapter.active) {
      selectedChapterNo = chapter.no;
      equippedSouvenir = getEquippedThemeForChapter(chapter.no) || '';
      selectedCategory = '전체';
      updateChapterHeader();
      applySouvenirTheme();
      renderToc();
      closeToc();
      renderHome();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });
  return btn;
}

    if (!list) return;
    list.innerHTML = '';
    CHAPTERS.forEach(chapter => {
      const li = document.createElement('li');
      li.appendChild(makeTocButton(chapter));
      list.appendChild(li);
    });
  });
}

function openToc() {
  const drawer = document.getElementById('tocDrawer');
  const backdrop = document.getElementById('tocBackdrop');
  if (!drawer || !backdrop) return;
  backdrop.hidden = false;
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
}

function closeToc() {
  const drawer = document.getElementById('tocDrawer');
  const backdrop = document.getElementById('tocBackdrop');
  if (!drawer || !backdrop) return;
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  setTimeout(() => { if (!drawer.classList.contains('open')) backdrop.hidden = true; }, 180);
}

function startQuiz(wrongOnly=false) {
  quiz = buildQuiz(selectedCategory, selectedCount, wrongOnly);
  currentIndex = 0;
  score = 0;
  beeCount = STARTING_BEES;
  teacherQuizMilestonesShown = new Set();
  teacherQuizQuestion = null;
  currentQuizScoreSaved = false;
  if (!quiz.length) return renderHome();
  renderQuestion();
}

  applySouvenirTheme();
  const q = quiz[currentIndex];
  selectedAnswer = null;
  selectedButton = null;
  submitted = false;
  app.innerHTML = '';
  app.append(quizTemplate.content.cloneNode(true));

  document.querySelector('#progressText').textContent = `${currentIndex + 1} / ${quiz.length}`;
  document.querySelector('#scoreText').textContent = `${score}점 · 벌 ${beeCount}마리 · 💎 ${gems}개`;
  document.querySelector('#progressBar').style.width = `${((currentIndex) / quiz.length) * 100}%`;
  document.querySelector('#questionType').textContent = q.typeLabel;
  document.querySelector('#questionText').textContent = q.question;
  renderBees();

  const answers = document.querySelector('#answers');
  q.options.forEach(option => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = option;
    btn.addEventListener('click', () => chooseAnswer(btn, option));
    answers.appendChild(btn);
  });

  document.querySelector('#submitBtn').addEventListener('click', () => submitAnswer(q));

  const quitTopBtn = document.querySelector('#quitQuizTopBtn');
  const quitBottomBtn = document.querySelector('#quitQuizBottomBtn');
  [quitTopBtn, quitBottomBtn].forEach(btn => {
    if (!btn) return;
    btn.addEventListener('click', quitQuizToHome);
  });

  document.querySelector('#nextBtn').addEventListener('click', () => {
    currentIndex++;
    if (currentIndex >= quiz.length) renderResult();
    else renderQuestion();
  });
}

function quitQuizToHome() {
  saveEconomy();
  renderHome();
}


function renderBees() {
  const countText = document.querySelector('#beeCountText');
  const hive = document.querySelector('#beeHive');
  if (!countText || !hive) return;
  countText.textContent = `${beeCount}마리`;
  const visibleCount = Math.min(Math.max(beeCount, 0), 60);
  hive.innerHTML = Array.from({ length: visibleCount }, () => '<span class="bee">🐝</span>').join('') + (beeCount > 60 ? `<span class="bee-more">+${beeCount - 60}</span>` : '');
}

function chooseAnswer(button, selected) {
  if (submitted) return;
  selectedAnswer = selected;
  selectedButton = button;
  document.querySelectorAll('.answer').forEach(btn => btn.classList.remove('selected'));
  button.classList.add('selected');
  const notice = document.querySelector('#selectionNotice');
  if (notice) notice.hidden = true;
}

function submitAnswer(q) {
  if (submitted) return;
  const notice = document.querySelector('#selectionNotice');
  if (!selectedAnswer) {
    if (notice) {
      notice.textContent = '답을 먼저 선택하세요.';
      notice.hidden = false;
    }
    return;
  }

  submitted = true;
  const correct = selectedAnswer === q.answer;
  document.querySelector('#submitBtn').disabled = true;
  document.querySelectorAll('.answer').forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === q.answer) btn.classList.add('correct');
    if (btn === selectedButton && !correct) btn.classList.add('wrong');
  });

  let conversionMessage = '';
  if (correct) {
    score++;
    beeCount++;
    beeBank++;
    conversionMessage = convertBeeBankToGems();
    removeWrong(q);
  } else {
    beeCount = Math.max(beeCount - 1, 0);
    addWrong(q);
  }

  renderBees();
  document.querySelector('#scoreText').textContent = `${score}점 · 벌 ${beeCount}마리 · 💎 ${gems}개`;

  const feedback = document.querySelector('#feedback');
  feedback.hidden = false;
  feedback.innerHTML = `
    <p><strong class="${correct ? 'good' : 'bad'}">${correct ? '벌 채집 성공' : '앗! 벌을 놓쳤습니다'}</strong></p>
    <p>${correct ? '벌이 한 마리 추가되었습니다.' : '벌 한 마리가 사라졌습니다.'}</p>
    ${conversionMessage ? `<p><strong>보석 변환:</strong> ${conversionMessage}</p>` : ''}
    <p><strong>정답:</strong> ${q.answer}</p>
    <p>${q.explanation}</p>
    <p><strong>사진자료:</strong> <a href="${q.item.photoUrl}" target="_blank" rel="noopener">${q.item.search}</a></p>`;

  document.querySelector('#progressBar').style.width = `${((currentIndex + 1) / quiz.length) * 100}%`;

  if (beeCount <= 0) {
    showBeeGameOver();
    return;
  }

  const answeredCount = currentIndex + 1;
  const currentTeacherPool = (selectedChapterNo === 1) ? TEACHER_QUIZ_QUESTIONS : [];
  if (currentTeacherPool.length && answeredCount % 5 === 0 && !teacherQuizMilestonesShown.has(answeredCount)) {
    teacherQuizMilestonesShown.add(answeredCount);
    teacherQuizQuestion = sample(currentTeacherPool, 1)[0];
    showTeacherQuizModal();
    return;
  }

  const nextBtn = document.querySelector('#nextBtn');
  nextBtn.hidden = false;
  nextBtn.disabled = false;
  nextBtn.textContent = currentIndex + 1 >= quiz.length ? '결과 보기' : '다음 문제';
}

function showBeeGameOver() {
  const submitBtn = document.querySelector('#submitBtn');
  const nextBtn = document.querySelector('#nextBtn');
  if (submitBtn) submitBtn.hidden = true;
  if (nextBtn) nextBtn.hidden = true;

  const panel = document.createElement('div');
  panel.className = 'feedback';
  panel.innerHTML = `
    <h3>벌을 다시 채집하시겠습니까?</h3>
    <p class="muted">벌이 0마리가 되어 퀴즈가 중지되었습니다.</p>
    <div class="game-over-actions">
      <button class="primary" id="restartBeeBtn">O</button>
      <button class="secondary" id="homeBeeBtn">X</button>
    </div>`;
  document.querySelector('.quiz-card').appendChild(panel);

  document.querySelector('#restartBeeBtn').addEventListener('click', () => {
    currentIndex = 0;
    score = 0;
    beeCount = STARTING_BEES;
    renderQuestion();
  });
  document.querySelector('#homeBeeBtn').addEventListener('click', renderHome);
}


function convertBeeBankToGems() {
  if (beeBank < 10) {
    safeSet('historyQuizBeeBank', String(beeBank));
    return '';
  }
  let converted = 0;
  while (beeBank >= 10) {
    beeBank -= 10;
    gems += 1;
    converted += 1;
  }
  safeSet('historyQuizBeeBank', String(beeBank));
  safeSet('historyQuizGems', String(gems));
  return `채집한 벌 10마리가 보석 ${converted}개로 바뀌었습니다. 현재 보석 ${gems}개, 다음 변환까지 벌 ${beeBank}/10마리입니다.`;
}

function saveEconomy() {
  safeSet('historyQuizGems', String(gems));
  safeSet('historyQuizBeeBank', String(beeBank));
  safeSet('historyQuizOwnedSouvenirs', JSON.stringify(ownedSouvenirs));
  const currentChapterNo = selectedChapterNo || 1;
  const legacyCurrent = getEquippedThemeForChapter(currentChapterNo) || equippedSouvenir || '';
  safeSet('historyQuizEquippedSouvenir', legacyCurrent);
  safeSet('historyQuizEquippedThemes', JSON.stringify(equippedThemesByChapter || {}));
}

function getSouvenirChapterNo(item) {
  if (!item) return 1;
  if (item.chapter) return item.chapter;
  if (item.collection && /^history\d+$/.test(item.collection)) {
    return Number(item.collection.replace('history', ''));
  }
  return 1;
}


function getEquippedThemeForChapter(chapterNo) {
  return equippedThemesByChapter[String(chapterNo)] || '';
}

function setEquippedThemeForChapter(chapterNo, itemId) {
  if (!chapterNo) return;
  if (itemId) equippedThemesByChapter[String(chapterNo)] = itemId;
  else delete equippedThemesByChapter[String(chapterNo)];
}

function isThemeEquipped(item, chapterNo = getSouvenirChapterNo(item)) {
  return !!item && item.type === 'theme' && getEquippedThemeForChapter(chapterNo) === item.id;
}

function normalizeLegacyThemeState() {
  if (!equippedThemesByChapter || typeof equippedThemesByChapter !== 'object') equippedThemesByChapter = {};
  if (Object.keys(equippedThemesByChapter).length) return;
  if (!equippedSouvenir) return;
  const legacy = SOUVENIRS.find(item => item.id === equippedSouvenir && item.type === 'theme');
  if (!legacy) return;
  setEquippedThemeForChapter(getSouvenirChapterNo(legacy), legacy.id);
}

normalizeLegacyThemeState();

function getShopSouvenirsForCurrentChapter() {
  const chapterNo = selectedChapterNo || 1;
  return SOUVENIRS.filter(item => getSouvenirChapterNo(item) === chapterNo);
}

function getOwnedSouvenirs() {
  // 내 아이템/내 보관함은 챕터와 관계없이 지금까지 산 모든 기념품을 보여 준다.
  return SOUVENIRS.filter(item => ownedSouvenirs.includes(item.id));
}

function renderHomeWallet() {
  const wallet = document.querySelector('#homeWallet');
  if (!wallet) return;
  const ownedItems = getOwnedSouvenirs();
  if (!ownedItems.length) {
    wallet.innerHTML = '<div class="wallet-empty">아직 지갑이 비어 있습니다.<br>퀴즈로 보석을 모아 기념품을 사 보세요.</div>';
    return;
  }
  wallet.innerHTML = ownedItems.map(item => `
    <button type="button" class="wallet-item wallet-item-button ${isThemeEquipped(item) ? 'equipped' : ''}" data-item-id="${item.id}" aria-label="${item.name} 카드 크게 보기">
      <span class="wallet-icon ${hasSouvenirArt(item) ? 'has-art' : ''}" aria-hidden="true">${getSouvenirVisual(item, 'wallet')}</span>
      <span class="wallet-name">${item.name}</span>
      <span class="wallet-card-hint">카드 보기 ›</span>
    </button>
  `).join('');

  wallet.querySelectorAll('.wallet-item-button').forEach(button => {
    button.addEventListener('click', () => {
      const item = SOUVENIRS.find(s => s.id === button.dataset.itemId);
      if (item) showMythItemCard(item);
    });
  });
}

  const isTheme = item.type === 'theme' && ownedSouvenirs.includes(item.id);
  const themeChapterNo = getSouvenirChapterNo(item);
  const isThemeForCurrentChapter = !isTheme || themeChapterNo === (selectedChapterNo || 1);
  const isEquipped = isThemeEquipped(item, themeChapterNo) && isThemeForCurrentChapter;

  backdrop.innerHTML = `
    <article class="myth-item-card" role="dialog" aria-modal="true" aria-label="${item.name} 상세 카드">

        <div><span>상징</span><strong>${meta.symbol}</strong></div>

      </div>

        <h3>아이템 이야기</h3>
        <p>${meta.story}</p>
      </section>

      <section class="item-card-ability">
        <span class="item-card-ability-star">✦</span>
        <div>
          <h3>${meta.abilityTitle}</h3>
          <p>${meta.ability}</p>
        </div>
      </section>

      ${isTheme ? `
        <section class="item-card-apply-wrap">
          <p class="item-card-apply-status" id="itemCardApplyStatus">${
            !isThemeForCurrentChapter
              ? `${themeChapterNo}챕터에서만 적용되는 배경권입니다.`
              : (isEquipped ? '현재 이 배경권이 적용 중입니다.' : '이 배경권을 현재 챕터에 적용할 수 있습니다.')

function showTeacherQuizModal() {
  const tq = teacherQuizQuestion || ((selectedChapterNo === 1 ? TEACHER_QUIZ_QUESTIONS : [])[0]) || TEACHER_QUIZ_QUESTIONS[0];
  let selected = null;
  let submittedTeacher = false;
  const modal = document.createElement('div');
  modal.className = 'modal-backdrop';
  modal.innerHTML = `
    <div class="modal-card teacher-quiz-modal" role="dialog" aria-modal="true" aria-label="선생님 퀴즈">
      <div class="teacher-quiz-art" aria-hidden="true"></div>
      <div class="teacher-quiz-body">
        <p class="eyebrow">중간 보너스</p>
        <h2>${tq.teacher} 선생님 퀴즈!!</h2>
        <p class="muted">5문제마다 열리는 보너스 퀴즈입니다. 맞히면 보석 1개를 받습니다.</p>
        <h3>${tq.question}</h3>
        <div id="teacherAnswers"></div>
        <div id="teacherNotice" class="selection-notice" hidden>답을 먼저 선택하세요.</div>
        <button class="primary full" id="teacherSubmitBtn">선생님 퀴즈 제출</button>
        <div id="teacherFeedback" class="feedback" hidden></div>
        <button class="secondary full" id="teacherContinueBtn" hidden>계속하기</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  const answers = modal.querySelector('#teacherAnswers');
  tq.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'teacher-answer';
    btn.textContent = opt;
    btn.addEventListener('click', () => {
      if (submittedTeacher) return;
      selected = opt;
      answers.querySelectorAll('.teacher-answer').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      modal.querySelector('#teacherNotice').hidden = true;
    });
    answers.appendChild(btn);
  });
  modal.querySelector('#teacherSubmitBtn').addEventListener('click', () => {
    if (submittedTeacher) return;
    if (!selected) {
      modal.querySelector('#teacherNotice').hidden = false;
      return;
    }
    submittedTeacher = true;
    const ok = selected === tq.answer;
    answers.querySelectorAll('.teacher-answer').forEach(btn => {
      btn.disabled = true;
      if (btn.textContent === tq.answer) btn.classList.add('correct');
      if (btn.textContent === selected && !ok) btn.classList.add('wrong');
    });
    if (ok) {
      gems += 1;
      saveEconomy();
    }
    const fb = modal.querySelector('#teacherFeedback');
    fb.hidden = false;
    fb.innerHTML = ok
      ? `<p><strong class="good">정답입니다.</strong></p><p>보석 1개를 받았습니다. 현재 보석은 ${gems}개입니다.</p>`
      : `<p><strong class="bad">아쉽습니다.</strong></p><p>정답은 <strong>${tq.answer}</strong>입니다.</p>`;
    modal.querySelector('#teacherSubmitBtn').hidden = true;
    modal.querySelector('#teacherContinueBtn').hidden = false;
  });
  modal.querySelector('#teacherContinueBtn').addEventListener('click', () => {
    modal.remove();
    revealNextAfterTeacherQuiz();
  });
}

function removeWrong(q) {
  const chapterNo = getQuestionChapterNo(q);
  wrongQuestions = wrongQuestions.filter(item => !(item.id === q.id && getQuestionChapterNo(item) === chapterNo));
  saveWrongQuestions();
}

function addWrong(q) {
  const chapterNo = getQuestionChapterNo(q);
  const saved = { ...q, chapter: chapterNo };
  const filtered = wrongQuestions.filter(item => !(item.id === q.id && getQuestionChapterNo(item) === chapterNo));
  wrongQuestions = [saved, ...filtered].slice(0, 80);
  saveWrongQuestions();
}

function renderResult() {
  if (!currentQuizScoreSaved) {
    totalScore += score;
    safeSet('historyQuizTotalScore', String(totalScore));
    currentQuizScoreSaved = true;
  }
  best = Math.max(best, score);
  safeSet('historyQuizBest', String(best));
  app.innerHTML = '';
  app.append(resultTemplate.content.cloneNode(true));

  const percent = Math.round((score / quiz.length) * 100);
  document.querySelector('#resultTitle').textContent = `${percent}점 수준입니다.`;
  document.querySelector('#resultSummary').textContent = percent >= 80 ? '핵심 키워드 연결이 좋습니다.' : percent >= 50 ? '기본 흐름은 잡혔습니다. 오답을 다시 확인하세요.' : '키워드 카드부터 다시 보는 것이 좋습니다.';
  document.querySelector('#finalScore').textContent = `${score}/${quiz.length}`;
  document.querySelector('#wrongCount').textContent = `${quiz.length - score}`;
  document.querySelector('#bestScore').textContent = `${best}`;
  document.querySelector('#totalScore').textContent = `${totalScore}`;
  document.querySelector('#finalBeeCount').textContent = `${beeCount}`;
  document.querySelector('#finalGemCount').textContent = `${gems}`;

  const retryWrongBtn = document.querySelector('#retryWrongBtn');
  const clearWrongResultBtn = document.querySelector('#clearWrongResultBtn');
  retryWrongBtn.hidden = false;
  clearWrongResultBtn.hidden = false;
  const chapterWrongs = getCurrentChapterWrongQuestions();
  if (chapterWrongs.length === 0) {
    retryWrongBtn.disabled = true;
    retryWrongBtn.textContent = '오답 확인 / 다시 풀기 (0)';
    clearWrongResultBtn.disabled = true;
  } else {
    retryWrongBtn.disabled = false;
    retryWrongBtn.textContent = `오답 확인 / 다시 풀기 (${chapterWrongs.length})`;
    clearWrongResultBtn.disabled = false;
  }
  retryWrongBtn.addEventListener('click', () => {
    if (getCurrentChapterWrongQuestions().length) startQuiz(true);
  });
  clearWrongResultBtn.addEventListener('click', () => {
    const chapterNo = selectedChapterNo || 1;
    wrongQuestions = wrongQuestions.filter(q => getQuestionChapterNo(q) !== chapterNo);
    saveWrongQuestions();
    renderResult();
  });
  document.querySelector('#newQuizBtn').addEventListener('click', renderHome);
  document.querySelector('#shareBtn').addEventListener('click', shareApp);

  const review = document.querySelector('#wrongReviewCard');
  const chapterWrongIds = new Set(getCurrentChapterWrongQuestions().map(w => w.id));
  const wrongInThisQuiz = quiz.filter(q => chapterWrongIds.has(q.id));
  if (!wrongInThisQuiz.length) {
    review.innerHTML = '<h3>오답 리뷰</h3><p class="empty">이번 퀴즈에서 새로 확인할 오답이 없습니다.</p>';
  } else {
    review.innerHTML = '<h3>오답 리뷰</h3>' + wrongInThisQuiz.map(q => `
      <div class="review-item">
        <h4>${q.item.keyword}</h4>
        <p class="muted">${q.item.visual}</p>
        <p><strong>핵심:</strong> ${q.item.importance}</p>
      </div>`).join('');
  }
}

function shareApp() {
  const shareData = { title: '역사 퀴즈', text: '그리스·로마 역사 키워드 퀴즈', url: location.href };
  if (navigator.share) navigator.share(shareData).catch(() => {});
  else navigator.clipboard.writeText(location.href).then(() => alert('링크를 복사했습니다.'));
}

function getSouvenirVisual(item, size = 'small') {
  if (item && SOUVENIR_ART_IMAGES[item.id]) {
    return `<span class="souvenir-art souvenir-art-${size}" aria-hidden="true"><img src="${SOUVENIR_ART_IMAGES[item.id]}" alt="${item.name}" loading="lazy"></span>`;
  }
  if (item && SOUVENIR_ART[item.id]) {
    return `<span class="souvenir-art souvenir-art-${size}" aria-hidden="true">${SOUVENIR_ART[item.id]}</span>`;
  }
  return item ? item.icon : '';
}

function hasSouvenirArt(item) {
  return !!(item && (SOUVENIR_ART_IMAGES[item.id] || SOUVENIR_ART[item.id]));
}

          <h3>${item.name}</h3>
          <p>${item.desc}</p>
          <p class="shop-effect">${item.effect}</p>
        </div>
      </div>
      <div class="shop-meta">
        <span class="currency-chip">💎 ${item.price}개</span>
        <div class="shop-actions">
          <button class="${owned ? 'secondary' : 'primary'}" data-buy="${item.id}" ${canBuy ? '' : 'disabled'}>${buyLabel}</button>
          ${themeButton}
        </div>
      </div>
    </article>`;
  }).join('');

  if (!shopItems.length) {
    list.innerHTML = '<p class="empty">이 챕터의 기념품샵 상품은 아직 준비 중입니다.</p>';
  }

  list.querySelectorAll('[data-buy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = SOUVENIRS.find(x => x.id === btn.dataset.buy);
      if (!item) return;
      if (ownedSouvenirs.includes(item.id)) {
        showShopNotice('이미 구매한 기념품입니다.', 'warn');
        return;
      }
      if (gems < item.price) {
        showShopNotice(`보석이 부족합니다. ${item.name}은 보석 ${item.price}개가 필요합니다.`, 'warn');
        return;
      }
      gems -= item.price;
      ownedSouvenirs.push(item.id);
      if (item.type === 'theme') setEquippedThemeForChapter(getSouvenirChapterNo(item), item.id);
      equippedSouvenir = getEquippedThemeForChapter(selectedChapterNo || 1) || '';
      saveEconomy();
      applySouvenirTheme();
      renderShop();
      showShopNotice(`${item.icon} ${item.name} 구매 완료! 보관함에 추가되었습니다.`, 'good');
    });
  });

  list.querySelectorAll('[data-equip]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = SOUVENIRS.find(x => x.id === btn.dataset.equip);
      if (!item || !ownedSouvenirs.includes(item.id)) return;
      if (item.type === 'theme' && getSouvenirChapterNo(item) !== (selectedChapterNo || 1)) return;
      const chapterNo = getSouvenirChapterNo(item);
      const active = isThemeEquipped(item, chapterNo);
      if (active) setEquippedThemeForChapter(chapterNo, '');
      else setEquippedThemeForChapter(chapterNo, item.id);
      equippedSouvenir = getEquippedThemeForChapter(selectedChapterNo || 1) || '';
      saveEconomy();
      applySouvenirTheme();
      renderShop();
      showShopNotice(isThemeEquipped(item, chapterNo) ? `${item.icon} ${item.name} 적용 완료!` : `${item.icon} ${item.name} 적용을 해제했습니다.`, 'good');
    });
  });

  const ownedList = document.querySelector('#ownedList');
  const ownedItems = getOwnedSouvenirs();
  if (!ownedItems.length) {
    ownedList.innerHTML = '<p class="empty">아직 구매한 기념품이 없습니다. 퀴즈와 선생님 퀴즈로 보석을 모아 보세요.</p>';
  } else {
    ownedList.innerHTML = ownedItems.map(item => {
      const equipped = isThemeEquipped(item);
      return `<button type="button" class="owned-item owned-item-button ${equipped ? 'equipped' : ''}" data-owned-card="${item.id}" aria-label="${item.name} 카드 크게 보기">
        <span class="owned-icon ${hasSouvenirArt(item) ? 'has-art' : ''}" aria-hidden="true">${getSouvenirVisual(item, 'owned')}</span>
        <span class="owned-item-copy">
          <strong>${item.name}</strong>
          <p>${equipped ? '현재 해당 챕터에서 적용 중입니다.' : item.effect}</p>
        </span>
        <span class="owned-item-hint">카드 보기 ›</span>
      </button>`;
    }).join('');

    ownedList.querySelectorAll('[data-owned-card]').forEach(button => {
      button.addEventListener('click', () => {
        const item = SOUVENIRS.find(s => s.id === button.dataset.ownedCard);
        if (item) showMythItemCard(item);
      });
    });
  }

  const home = document.createElement('button');
  home.className = 'secondary full';
  home.textContent = '홈으로 돌아가기';
  home.addEventListener('click', renderHome);
  app.appendChild(home);
}



function getCardsViewChapterNo() {
  return typeof cardsFilterChapterNo === 'number' ? cardsFilterChapterNo : 0;
}

function getCardsViewItems() {
  const chapterNo = getCardsViewChapterNo();
  return DATA.items.filter(item => chapterNo === 0 || (item.chapter || 1) === chapterNo);
}

function updateCardsPageChrome() {
  const title = document.querySelector('#cardsPageTitle');
  const subtitle = document.querySelector('#cardsPageSubtitle');
  const input = document.querySelector('#cardSearch');
  const chapterNo = getCardsViewChapterNo();
  const currentItems = getCardsViewItems();
  const chapter = CHAPTERS.find(c => c.no === chapterNo);

  if (title) {
    if (chapterNo === 0) {
      title.textContent = `${currentItems.length}개 키워드 자료실`;
    } else {
      title.textContent = chapter && chapter.title !== '준비 중'
        ? `${currentItems.length}개 · ${chapter.title}`
        : `${chapterNo}챕터 키워드 자료실`;
    }
  }

  if (subtitle) {
    if (chapterNo === 0) {
      subtitle.textContent = '전체 12개 챕터를 기준으로, 준비된 키워드 카드를 한 번에 보고 챕터별로 골라볼 수 있습니다.';
    } else if (chapter && chapter.active) {
      subtitle.textContent = `${chapterNo}챕터의 키워드 카드만 모아 보고 있습니다.`;
    } else {
      subtitle.textContent = `${chapterNo}챕터는 아직 준비 중입니다.`;
    }
  }

  if (input) {
    input.placeholder = chapterNo === 2
      ? '키워드 검색: 선사, 주먹도끼, 고조선, 삼한…'
      : chapterNo === 1
        ? '키워드 검색: 카메오, 라라리움, 아테나…'
        : '키워드 검색: 챕터를 선택하거나 키워드를 입력해 보세요.';
  }
}

function renderCardsChapterFilters() {
  const wrap = document.querySelector('#cardsChapterFilters');
  if (!wrap) return;
  const current = getCardsViewChapterNo();
  const buttons = [
    { no: 0, label: '전체', active: true }
  ].concat(CHAPTERS.map(chapter => ({
    no: chapter.no,
    label: `${chapter.no}챕터`,
    active: !!chapter.active
  })));

  wrap.innerHTML = buttons.map(button => {
    const isActive = current === button.no;
    const locked = button.no !== 0 && !button.active;
    return `<button type="button" class="chapter-filter-btn${isActive ? ' active' : ''}${locked ? ' locked' : ''}" data-card-filter="${button.no}">${button.label}</button>`;
  }).join('');

  wrap.querySelectorAll('[data-card-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      cardsFilterChapterNo = Number(btn.dataset.cardFilter || '0');
      updateCardsPageChrome();
      renderCardsChapterFilters();
      renderCardList(document.querySelector('#cardSearch')?.value || '');
    });
  });
}


function renderCards() {
  applySouvenirTheme();
  updateChapterHeader();
  app.innerHTML = '';
  app.append(cardsTemplate.content.cloneNode(true));

  cardsFilterChapterNo = selectedChapterNo || 0;

  const input = document.querySelector('#cardSearch');
  if (input) {
    input.addEventListener('input', () => renderCardList(input.value));
  }

  updateCardsPageChrome();
  renderCardsChapterFilters();
  renderCardList('');
}

function renderCardList(query) {
  const list = document.querySelector('#cardsList');
  const q = (query || '').trim().toLowerCase();
  const chapterNo = getCardsViewChapterNo();
  const items = getCardsViewItems().filter(item => {
    const text = `${item.keyword} ${item.english} ${item.visual} ${item.meaning || ''} ${item.easy || ''} ${item.importance} ${item.search} ${item.categories.join(' ')}`.toLowerCase();
    return !q || text.includes(q);
  });

  if (!items.length) {
    list.innerHTML = chapterNo && !CHAPTERS.find(c => c.no === chapterNo)?.active
      ? '<p class="empty">이 챕터의 키워드 카드는 아직 준비 중입니다.</p>'
      : '<p class="empty">검색 결과가 없습니다.</p>';
    return;
  }

  list.innerHTML = items.map(item => {
    const chapterLabel = `챕터 ${item.chapter || 1}`;
    return `
      <article class="keyword-card">
        <span class="chapter-mini-label">${chapterLabel}</span>
        <p class="eyebrow">No. ${item.no}</p>
        <h3>${item.keyword}</h3>
        <p><strong>영어/원어:</strong> ${item.english}</p>
        <p><strong>사진으로 볼 대상:</strong> ${item.visual}</p>
        ${item.meaning ? `<p><strong>뜻:</strong> ${item.meaning}</p>` : ''}
        <p><strong>왜 중요한가:</strong> ${item.importance}</p>
        ${item.easy ? `<p><strong>쉽게 이해하기:</strong> ${item.easy}</p>` : ''}
        <p><a href="${item.photoUrl}" target="_blank" rel="noopener">사진자료 검색 열기</a></p>
        <div class="tag-row">${item.categories.map(c => `<span class="tag">${c}</span>`).join('')}</div>
      </article>`;
  }).join('');
}

document.querySelector('#tocBtn').addEventListener('click', openToc);
document.querySelector('#tocCloseBtn').addEventListener('click', closeToc);
document.querySelector('#tocBackdrop').addEventListener('click', closeToc);
document.querySelector('#cardsBtn').addEventListener('click', renderCards);

try {
  applySouvenirTheme();
  renderToc();
  updateChapterHeader();
  renderHome();
} catch (err) {
  app.innerHTML = '<section class="card"><h2>앱을 여는 중 문제가 생겼습니다.</h2><p class="muted">휴대폰 파일 미리보기에서 스크립트가 제한되었을 수 있습니다. Chrome 또는 Samsung Internet으로 다시 열어주세요.</p><p class="muted">오류: ' + String(err.message || err) + '</p></section>';
}

  </script>
</body>
</html>
